name: ci

on:
  push:
    branches: [prod]
    # Prose only. Listed one by one rather than as `**.md`, because
    # packages/cira-skill/SKILL.md is not prose: it is read at runtime, copied
    # into the CLI bundle, and covered by skill.test.ts. Ignoring it would skip
    # the tests for the thing that changed.
    paths-ignore:
      - "README.md"
      - "CHECKLIST.md"
      - "docs/**"
      - "packages/cli/README.md"
  # A pull request is checked the same way, which is the whole point of
  # Dependabot raising them: an update nothing ran is an update nobody can
  # take the word of. Only `verify` runs - the deploy job below is for a push
  # to prod - and it needs no secret, so it works on Dependabot's own branches.
  pull_request:
    branches: [prod]
    paths-ignore:
      - "README.md"
      - "CHECKLIST.md"
      - "docs/**"
      - "packages/cli/README.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck / lint / build / test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The journey tests run against a real Postgres, because the constraints
    # ARE the safety. A fake would pass while the real schema rejected the same
    # writes, which is precisely what those tests exist to catch.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cira_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/cira_test

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format

      # Every package except the web app, whose `next build` is done again by
      # `vercel build` in the deploy job a minute later. This still builds the
      # CLI bundle, which nothing else covers - a broken bundle would otherwise
      # surface only at publish time.
      - name: Build
        run: pnpm -r --if-present --filter '!@cira/web' build

      - name: Test
        run: pnpm test

  deploy:
    name: deploy
    needs: verify
    # A run started by hand deploys too. It is how a change to Vercel's
    # environment variables reaches production: public ones are compiled into
    # the build, so they take a fresh build, and redeploying an existing one
    # from Vercel reuses its output with the old values baked in.
    if: github.ref == 'refs/heads/prod' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The deploy is driven from here rather than from Vercel's Git integration
    # on purpose. Vercel would build on every push regardless of this workflow,
    # so a red pipeline would still ship. Gating it on `verify` is what makes
    # "green means deploy" true.
    env:
      VERCEL_ORG_ID: team_qPpeOGgkf62pvo2aAbBMWAQX
      VERCEL_PROJECT_ID: prj_R6VA3mzvZHtnNJZ7iqQNdjeWpvbG

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the deploy, never after. Code and schema used to ship on
      # separate tracks - this one automated, migrations run by hand - and the
      # failure mode was not a red build but a green one over a broken site:
      # the first request to touch a missing column is how you find out.
      #
      # Safe only because migrations are additive (see "Expand, then contract"
      # in CHECKLIST.md). There is a window where the previous deployment is
      # still serving against the new schema, so a migration that removes
      # something the running code still reads would break production even
      # though every step here went green.
      #
      # Unpooled: Neon's pooler runs PgBouncer in transaction mode, which is
      # the wrong shape for DDL. Re-running is a no-op - drizzle records what
      # it has applied and skips it.
      - name: Migrate the database
        run: pnpm --filter @cira/db db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

      # VERCEL_TOKEN expires 2026-12-14 (90 days from 2026-09-15). When it
      # lapses, these steps fail with an authentication error rather than
      # anything that mentions expiry, so check the token first.
      #
      # Cached, because the version is pinned: downloading the same CLI on
      # every push cost longer than the deploy it then performed. Installed
      # into a prefix rather than globally so there is a single directory to
      # cache, and its bin is put on PATH explicitly - pnpm's global bin is not
      # on PATH on the runner, and npm's is not either under a custom prefix.
      - name: Cache the Vercel CLI
        id: vercel-cli
        uses: actions/cache@v6
        with:
          path: ~/.vercel-cli
          key: vercel-cli-59-${{ runner.os }}

      - name: Install Vercel CLI
        if: steps.vercel-cli.outputs.cache-hit != 'true'
        run: npm install --prefix ~/.vercel-cli vercel@59

      - name: Put the Vercel CLI on PATH
        run: echo "$HOME/.vercel-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Pull project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          # Uploads source maps to Sentry at the end of the build. Absent, the
          # build still succeeds and simply skips the upload.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed: $url"
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
